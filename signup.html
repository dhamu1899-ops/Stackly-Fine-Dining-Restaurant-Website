<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — Stackly Fine Dining</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#0b0e10] text-[#cfd8dc] antialiased selection:bg-[#c9a050] selection:text-black">

<div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm w-full px-4 pointer-events-none"></div>

<a href="index.html" class="fixed top-5 right-5 z-30 p-2.5 rounded-full bg-[#141b1d] border border-[#232f33] text-gray-300 hover:text-[#c9a050] hover:border-[#c9a050] transition-all" aria-label="Close">
  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
</a>

<main class="min-h-screen grid grid-cols-1 lg:grid-cols-2">
  <div class="hidden lg:block relative">
    <img src="assets/images/photo-1517248135467-4c7edcad34c4.webp" alt="Stackly dining room" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-black/20"></div>
    <div class="absolute bottom-0 left-0 right-0 p-12 space-y-3">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#182124]/90 border border-[#c9a050]/40 text-[#c9a050] text-[11px] uppercase tracking-widest font-semibold">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/></svg>
        <span>Stackly Gourmet Society</span>
      </div>
      <h3 class="font-serif text-3xl font-bold text-white leading-tight">Join for exclusive chef tasting invitations.</h3>
      <p class="text-sm text-gray-300 font-light">Create your account to earn loyalty points on every reservation and order.</p>
    </div>
  </div>

  <div class="flex items-center justify-center p-6 sm:p-12">
    <div class="w-full max-w-md space-y-6">
      <a href="index.html" class="flex items-center gap-3 group w-fit">
        <img src="assets/images/logo.svg" alt="Stackly" class="w-10 h-10 object-contain">
        <div class="flex flex-col">
          <span class="font-serif text-xl font-bold tracking-[0.2em] text-white uppercase group-hover:text-[#c9a050] transition-colors">Stackly</span>
          <span class="text-[9px] uppercase tracking-[0.3em] text-[#c9a050] font-medium -mt-1">Fine Dining & Gourmet</span>
        </div>
      </a>

      <div class="space-y-2">
        <h2 class="font-serif text-3xl font-bold uppercase tracking-wide text-white">Create Account</h2>
        <p class="text-xs text-gray-400 font-light">Join Stackly Gourmet Society for exclusive chef tasting invitations.</p>
      </div>

      <div class="grid grid-cols-2 gap-2 p-1 bg-[#141b1d] border border-[#28363a] rounded-2xl">
        <button type="button" data-role="customer" class="py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-all bg-gradient-to-r from-[#d4af37] via-[#c9a050] to-[#b88e38] text-black shadow-md">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a8.25 8.25 0 0 1 15 0"/></svg>
          <span>Customer</span>
        </button>
        <button type="button" data-role="admin" class="py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-all text-gray-400 hover:text-white">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m6-3v8.25a9 9 0 0 1-9 9 9 9 0 0 1-9-9V6.75l9-4 9 4Z"/></svg>
          <span>Admin / Staff</span>
        </button>
      </div>

      <form id="signup-form" class="space-y-4" novalidate>
        <div class="space-y-1">
          <label class="text-[11px] text-gray-300 font-medium uppercase tracking-wider block">Full Name</label>
          <div class="relative">
            <svg class="w-4 h-4 text-[#c9a050] absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a8.25 8.25 0 0 1 15 0"/></svg>
            <input id="signup-name" type="text" required placeholder="e.g. Dhamu Kumar" class="w-full bg-[#141b1d] border border-[#28363a] rounded-xl py-3 pl-10 pr-4 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-[#c9a050]">
          </div>
        </div>
        <div class="space-y-1">
          <label class="text-[11px] text-gray-300 font-medium uppercase tracking-wider block">Email Address</label>
          <div class="relative">
            <svg class="w-4 h-4 text-[#c9a050] absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.007 1.874l-7.5 5.006a2.25 2.25 0 0 1-2.486 0l-7.5-5.006A2.25 2.25 0 0 1 2.25 6.993V6.75"/></svg>
            <input id="signup-email" type="email" required placeholder="your.email@example.com" class="w-full bg-[#141b1d] border border-[#28363a] rounded-xl py-3 pl-10 pr-4 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-[#c9a050]">
          </div>
        </div>
        <div class="space-y-1">
          <label class="text-[11px] text-gray-300 font-medium uppercase tracking-wider block">Password</label>
          <div class="relative">
            <svg class="w-4 h-4 text-[#c9a050] absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
            <input id="signup-password" type="password" required minlength="4" placeholder="••••••••" class="w-full bg-[#141b1d] border border-[#28363a] rounded-xl py-3 pl-10 pr-11 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-[#c9a050]">
            <button type="button" id="signup-pw-toggle" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-[#c9a050]">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
            </button>
          </div>
        </div>
        <div class="space-y-1">
          <label class="text-[11px] text-gray-300 font-medium uppercase tracking-wider block">Confirm Password</label>
          <input id="signup-confirm-password" type="password" required minlength="4" placeholder="••••••••" class="w-full bg-[#141b1d] border border-[#28363a] rounded-xl py-3 px-4 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-[#c9a050]">
        </div>
        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-[#d4af37] via-[#c9a050] to-[#b88e38] text-black font-bold text-xs uppercase tracking-[0.2em] rounded-xl shadow-lg hover:shadow-[0_0_20px_rgba(201,160,80,0.5)] transition-all flex items-center justify-center gap-2 mt-2">
          <span id="signup-submit-label">Sign Up as customer</span>
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
        </button>
      </form>

      <p class="text-center text-xs text-gray-400">Already have an account? <a href="login.html" class="text-[#c9a050] font-semibold hover:underline">Login Here</a></p>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/form-guard.js"></script>
<script src="assets/js/signup.js"></script>
</body>
</html>
